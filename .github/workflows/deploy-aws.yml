name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose variables and protection rules apply
        type: choice
        options: [demo]
        default: demo
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-aws-${{ inputs.environment || 'demo' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build image and deploy to ECS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'demo' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check deployment configuration
        id: config
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
        run: |
          missing=()
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE CONTAINER_NAME; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AWS deployment skipped::AWS is not configured for this repository. Missing variables: ${missing[*]}. See docs/DEPLOYMENT.md."
            {
              echo "### AWS deployment skipped"
              echo
              echo "Nothing was built or deployed because these repository or environment variables are not set:"
              echo
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
              echo
              echo "Set them under **Settings > Secrets and variables > Actions > Variables** (see docs/DEPLOYMENT.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: brickflow-deploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        if: steps.config.outputs.configured == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        if: steps.config.outputs.configured == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build --pull --platform linux/amd64 --tag "$image" --tag "$REGISTRY/$REPOSITORY:latest" .
          docker push "$image"
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Download the running task definition
        if: steps.config.outputs.configured == 'true'
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          current=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ -z "$current" ] || [ "$current" = "None" ]; then
            echo "::error::Service $ECS_SERVICE was not found in cluster $ECS_CLUSTER."
            exit 1
          fi
          aws ecs describe-task-definition --task-definition "$current" --query taskDefinition > task-definition.json

      - name: Render task definition with the new image
        if: steps.config.outputs.configured == 'true'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to Amazon ECS
        if: steps.config.outputs.configured == 'true'
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 20

      - name: Summarise deployment
        if: steps.config.outputs.configured == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TASK_DEFINITION: ${{ steps.deploy.outputs.task-definition-arn }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          {
            echo "### Deployed to Amazon ECS"
            echo
            echo "- Service: \`$ECS_SERVICE\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Task definition: \`$TASK_DEFINITION\`"
          } >> "$GITHUB_STEP_SUMMARY"
