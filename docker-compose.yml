# Local development. `docker compose up -d postgres` starts only the database (for `npm run dev`);
# `docker compose up --build` also builds and runs the app container on http://localhost:3000.
name: brickflow

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: brickflow
      POSTGRES_PASSWORD: brickflow
      POSTGRES_DB: brickflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickflow -d brickflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
    image: brickflow:local
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://brickflow:brickflow@postgres:5432/brickflow
      STORAGE_DRIVER: local
      STORAGE_DIR: /app/data/storage
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (at least 32 random characters) in your shell or .env}
      MFA_ENFORCED: ${MFA_ENFORCED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-BrickFlow@2026}
      DEMO_DATASET: ${DEMO_DATASET:-standard}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SEED_ON_START: ${SEED_ON_START:-false}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY (openssl rand -base64 32) in your shell or .env}
      # The container runs in production mode, so the offline verification sandbox must be allowed explicitly.
      VERIFICATION_PROVIDER: ${VERIFICATION_PROVIDER:-sandbox}
      ALLOW_SANDBOX_VERIFICATION: ${ALLOW_SANDBOX_VERIFICATION:-true}
      KYC_ENFORCED: ${KYC_ENFORCED:-true}
    volumes:
      - app-storage:/app/data/storage
    restart: unless-stopped

volumes:
  postgres-data:
  app-storage:
