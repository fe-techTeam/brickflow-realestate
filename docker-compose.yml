# Local development. `docker compose up -d postgres` starts only the database (for `npm run dev`);
# `docker compose up --build` also builds and runs the app container on http://localhost:3000.
name: brickflow

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: brickflow
      POSTGRES_PASSWORD: brickflow
      POSTGRES_DB: brickflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickflow -d brickflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
    image: brickflow:local
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://brickflow:brickflow@postgres:5432/brickflow
      STORAGE_DRIVER: local
      STORAGE_DIR: /app/data/storage
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (at least 32 random characters) in your shell or .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-BrickFlow@2026}
      DEMO_DATASET: ${DEMO_DATASET:-standard}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SEED_ON_START: ${SEED_ON_START:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-none}
    volumes:
      - app-storage:/app/data/storage
    restart: unless-stopped

  # Background jobs (notification delivery, reminders). For local use, emails are written to the
  # worker log; set EMAIL_PROVIDER=smtp and the SMTP_* variables to send real email.
  worker:
    image: brickflow:local
    init: true
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "src/worker/main.ts"]
    environment:
      DATABASE_URL: postgresql://brickflow:brickflow@postgres:5432/brickflow
      DATABASE_POOL_MAX: "5"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (at least 32 random characters) in your shell or .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_ALLOW_LOG_IN_PRODUCTION: ${EMAIL_ALLOW_LOG_IN_PRODUCTION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-none}
      WORKER_HEARTBEAT_FILE: /tmp/brickflow-worker.alive
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/brickflow-worker.alive');process.exit(Date.now()-s.mtimeMs<120000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
  app-storage:
