# Single-server production stack: Caddy (automatic HTTPS) -> app -> PostgreSQL, plus a nightly
# pg_dump backup. Only Caddy publishes ports (80/443). See docs/DEPLOYMENT.md, section
# "Single server with Docker Compose and PostgreSQL".
#
#   docker compose -f docker-compose.prod.yml up -d --build    (variables from .env next to this file)
name: brickflow

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# WhatsApp settings shared by the app (preferences page, delivery-status webhook) and the worker.
x-whatsapp-env: &whatsapp-env
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-none}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}

services:
  caddy:
    image: caddy:2.11.7-alpine
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public host name, e.g. demo.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    logging: *logging
    restart: unless-stopped

  app:
    build:
      context: .
    image: brickflow:${BRICKFLOW_VERSION:-latest}
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://brickflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/brickflow
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      STORAGE_DRIVER: local
      STORAGE_DIR: /app/data/storage
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (at least 32 random characters)}
      APP_URL: https://${DOMAIN}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-BrickFlow@2026}
      DEMO_DATASET: ${DEMO_DATASET:-standard}
      SEED_ON_START: ${SEED_ON_START:-false}
      <<: *whatsapp-env
    volumes:
      - app-storage:/app/data/storage
    networks: [edge, backend]
    logging: *logging
    restart: unless-stopped

  # Background jobs: notification delivery (email, WhatsApp), reminders and maintenance. Same image as
  # the app; starts once the app is healthy, i.e. after migrations have been applied. Scale with
  # `--scale worker=N`: jobs are claimed with row locks, so workers never run the same job twice.
  worker:
    image: brickflow:${BRICKFLOW_VERSION:-latest}
    init: true
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "src/worker/main.ts"]
    environment:
      DATABASE_URL: postgresql://brickflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/brickflow
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-5}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (at least 32 random characters)}
      APP_URL: https://${DOMAIN}
      # The worker refuses to start without a provider; EMAIL_PROVIDER=log is accepted here only
      # together with EMAIL_ALLOW_LOG_IN_PRODUCTION=true.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_ALLOW_LOG_IN_PRODUCTION: ${EMAIL_ALLOW_LOG_IN_PRODUCTION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_RATE_LIMIT_PER_SECOND: ${SMTP_RATE_LIMIT_PER_SECOND:-}
      <<: *whatsapp-env
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v27.0}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-60000}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-25000}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-8}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-14}
      SETTLEMENT_REMINDER_CRON: ${SETTLEMENT_REMINDER_CRON:-0 9 * * *}
      WORKER_HEARTBEAT_FILE: /tmp/brickflow-worker.alive
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/brickflow-worker.alive');process.exit(Date.now()-s.mtimeMs<120000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # SIGTERM lets running jobs finish (WORKER_SHUTDOWN_TIMEOUT_MS) before they are handed back.
    stop_grace_period: 40s
    networks: [edge, backend]
    logging: *logging
    restart: unless-stopped

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: brickflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: brickflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickflow -d brickflow"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [backend]
    logging: *logging
    restart: unless-stopped

  backup:
    image: postgres:17.11-alpine3.24
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: brickflow
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: brickflow
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infra/compose/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - postgres-backups:/backups
    networks: [backend]
    logging: *logging
    restart: unless-stopped

networks:
  edge:
  # No route to the internet: PostgreSQL and the backup job are reachable only from the app.
  backend:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  app-storage:
  postgres-data:
  postgres-backups:
